[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amor-mortuorum"
version = "0.1.0"
description = "Amor Mortuorum - A modern, dark roguelite built with Python + Arcade"
readme = "README.md"
authors = [{ name = "Amor Mortuorum Team" }]
requires-python = ">=3.10"
dependencies = [
    "arcade>=3.3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4.1",
    "flake8>=7",
    "flake8-bugbear>=24",
]
build = [
    "pyinstaller>=6",
]

[project.scripts]
amor = "amormortuorum.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["amormortuorum*"]

[tool.setuptools.package-data]
amormortuorum = ["config/*.json", "data/*.json"]
