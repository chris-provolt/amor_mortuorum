[pytest]
addopts = -q -m "not gl"
testpaths = tests
pythonpath = src .
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

markers =
    integration: marks tests as integration (deselect with '-m "not integration"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    gl: tests that open a real window/GL context (run with AMOR_GL_TESTS=1 -m gl)
