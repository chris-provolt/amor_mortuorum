name: CI / Lint / Test / Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  actions: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'
  FORCE_COLOR: '1'

jobs:
  lint_and_test:
    name: Lint and Test (Py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.13' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e ".[dev]"

      - name: Flake8 lint
        run: flake8 .

      - name: Unit tests (no window required)
        run: pytest

      - name: Headless smoke run (Arcade EGL; advisory until proven stable)
        if: matrix.python-version == '3.13'
        continue-on-error: true
        env:
          ARCADE_HEADLESS: 'True'
          AMOR_HEADLESS: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1-mesa-dri libgles2
          python -m amormortuorum --smoke 60 --seed 1

  build:
    name: Build binaries (tagged) [${{ matrix.os }}]
    needs: lint_and_test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ '3.11' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and build tools
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install ".[build]"

      - name: Build binary with PyInstaller
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          python tools/ci/build_binary.py --name "AmorMortuorum" --out dist/release

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: dist/release/*
          if-no-files-found: error

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
